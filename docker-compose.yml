version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB:       hazardmap
      POSTGRES_USER:     hazardmap
      POSTGRES_PASSWORD: hazardmap_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazardmap -d hazardmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://hazardmap:hazardmap_dev@db:5432/hazardmap
      - CORS_ALLOWED_ORIGINS=*
      - AUTO_SIM_MIN_MAGNITUDE=0.0
      - AUTO_SIM_MAX_DEPTH_KM=300.0
      - VS30_RASTER_PATH=/app/data/soil/india_vs30.tif
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/vite.config.js:/app/vite.config.js
    environment:
      - VITE_ML_API_URL=http://backend:8000
      - VITE_SCIENTIFIC_API_URL=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  pg_data:
